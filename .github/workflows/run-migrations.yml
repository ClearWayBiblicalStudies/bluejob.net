name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci

      - name: Check DATABASE_URL format safely
        run: |
          node -e '
          const u = new URL(process.env.DATABASE_URL);
          console.log("host:", u.hostname);
          console.log("port:", u.port);
          console.log("database:", u.pathname);
          console.log("sslmode:", u.searchParams.get("sslmode"));
          console.log("has sslrootcert:", u.searchParams.has("sslrootcert"));
          '

      - name: Run database migrations
        run: npm run migrate
