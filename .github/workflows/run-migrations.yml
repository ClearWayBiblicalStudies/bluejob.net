name: BlueJob Production Database Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-migrations.yml
      - server/migrate.js
      - server/migrations/**
      - server/package.json
      - server/package-lock.json

concurrency:
  group: bluejob-production-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Validate database URI
        env:
          BLUEJOB_DATABASE_SECRET: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const secret = process.env.BLUEJOB_DATABASE_SECRET || "";
          console.log(`::add-mask::${secret}`);
          const raw = secret.trim();
          const line = raw.split(/\r?\n/).map(line => line.trim()).find(
            line => /^(?:[A-Za-z_][A-Za-z0-9_]*=)?postgres(?:ql)?:\/\//i.test(line)
          );
          if (!line) throw new Error("DATABASE_URL must contain a PostgreSQL URI.");
          const value = line.replace(/^[A-Za-z_][A-Za-z0-9_]*=/, "");
          let url;
          try { url = new URL(value); } catch { throw new Error("DATABASE_URL is not a valid PostgreSQL URI."); }
          if (!["postgres:", "postgresql:"].includes(url.protocol) || !url.username || !url.password || !url.hostname || !url.pathname || url.pathname === "/") {
            throw new Error("DATABASE_URL must contain PostgreSQL credentials, host, and database.");
          }
          url.searchParams.delete("sslrootcert");
          url.searchParams.set("sslmode", "require");
          const cleanUrl = url.toString();
          console.log(`::add-mask::${cleanUrl}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL<<BLUEJOB_DATABASE\n${cleanUrl}\nBLUEJOB_DATABASE\n`);
          NODE
      - name: Authenticate and preflight bluejob
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          node <<'NODE'
          const { Client } = require("pg");
          const schema = "bluejob";
          const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 15000, statement_timeout: 30000, ssl: { rejectUnauthorized: false } });
          let connected = false;
          async function main() {
            try {
              await client.connect();
              connected = true;
              const identity = await client.query("SELECT current_user, current_database()");
              console.log("current_user:", identity.rows[0].current_user);
              console.log("current_database:", identity.rows[0].current_database);
              console.log("target_schema:", schema);
              await client.query("BEGIN");
              try {
                await client.query(`CREATE SCHEMA IF NOT EXISTS ${schema}`);
                const access = await client.query("SELECT has_schema_privilege(current_user, $1, 'USAGE') AS usage, has_schema_privilege(current_user, $1, 'CREATE') AS create", [schema]);
                if (!access.rows[0].usage || !access.rows[0].create) throw new Error("Database user lacks bluejob schema access.");
                await client.query(`CREATE TABLE ${schema}.__bluejob_migration_probe (id bigint PRIMARY KEY)`);
                await client.query("ROLLBACK");
              } catch (error) {
                await client.query("ROLLBACK");
                throw error;
              }
            } finally {
              if (connected) await client.end();
            }
          }
          main().catch(error => { console.error("BlueJob preflight failed:", error.message); process.exit(1); });
          NODE
      - name: Run migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: production
        run: npm run migrate
      - name: Verify migrated database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          node <<'NODE'
          const { Client } = require("pg");
          const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 15000, ssl: { rejectUnauthorized: false } });
          async function main() {
            await client.connect();
            try {
              const migrations = await client.query("SELECT to_regclass('bluejob.schema_migrations') AS table_name");
              if (!migrations.rows[0].table_name) throw new Error("bluejob.schema_migrations does not exist.");
              const tables = await client.query("SELECT tablename FROM pg_tables WHERE schemaname = 'bluejob'");
              const names = new Set(tables.rows.map(row => row.tablename));
              for (const table of ["users", "jobs"]) if (!names.has(table)) throw new Error(`Missing bluejob.${table}.`);
              console.log("target_schema: bluejob");
              console.log("migration_table: bluejob.schema_migrations");
              console.log("application_tables: users, jobs");
            } finally {
              await client.end();
            }
          }
          main().catch(error => { console.error("BlueJob verification failed:", error.message); process.exit(1); });
          NODE
