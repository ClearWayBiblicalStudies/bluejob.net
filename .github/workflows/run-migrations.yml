name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install server dependencies
        run: npm install

      - name: Build PlanetScale connection
        shell: bash
        env:
          PLANETSCALE_PASSWORD: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          let secret = (process.env.PLANETSCALE_PASSWORD || "").trim();

          if (!secret) {
            throw new Error("DATABASE_URL secret is empty");
          }

          // If the secret is already a URI, extract its password.
          if (secret.startsWith("postgresql://") || secret.startsWith("postgres://")) {
            const supplied = new URL(secret);
            secret = decodeURIComponent(supplied.password);
          }

          // Mask it BEFORE doing anything else.
          console.log(`::add-mask::${secret}`);

          const url = new URL(
            "postgresql://postgres.la4e9pgvuhqw@aws-us-east-1-1.pg.psdb.cloud:5432/postgres"
          );

          url.password = secret;
          url.searchParams.set("sslmode", "require");
          url.searchParams.set("options", "-c search_path=bluejob");

          const finalUrl = url.toString();

          console.log(`::add-mask::${finalUrl}`);

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DATABASE_URL=${finalUrl}\n`
          );

          console.log("PlanetScale connection built successfully");
          NODE

      - name: Run database migrations
        run: npm run migrate
