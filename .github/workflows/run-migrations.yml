name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci

      - name: Check DATABASE_URL format safely
        run: |
          node - <<'NODE'
          const raw = process.env.DATABASE_URL;
          const value = typeof raw === "string" ? raw.trim() : "";

          console.log("DATABASE_URL present:", value.length > 0);
          if (!value) {
            console.error("DATABASE_URL is missing or empty");
            process.exit(1);
          }

          try {
            const url = new URL(value);
            console.log("URL parse: OK");
            console.log("protocol:", url.protocol);
            console.log("host present:", Boolean(url.hostname));
            console.log("sslmode:", url.searchParams.get("sslmode"));
            console.log("has sslrootcert:", url.searchParams.has("sslrootcert"));
          } catch {
            console.error("DATABASE_URL is malformed");
            process.exit(1);
          }
          NODE

      - name: Run database migrations
        run: npm run migrate
