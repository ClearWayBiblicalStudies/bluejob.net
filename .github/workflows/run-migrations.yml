name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci

      - name: Normalize DATABASE_URL safely
        run: |
          node <<'NODE'
          const fs = require("fs");

          let raw = process.env.DATABASE_URL || "";
          raw = raw.trim();

          // Decode common copy/paste HTML artifacts
          raw = raw.replace(/&amp;/g, "&");

          // Remove common wrappers
          raw = raw.replace(/^DATABASE_URL\s*=\s*/i, "");
          raw = raw.replace(/^psql\s+/i, "");
          raw = raw.replace(/^["']|["']$/g, "");

          // Extract PostgreSQL URI even if surrounded by other text
          const match = raw.match(/postgres(?:ql)?:\/\/[^\s"'\\>)\]]+/i);

          if (!match) {
            console.error("No PostgreSQL URI found inside DATABASE_URL");
            process.exit(1);
          }

          let v = match[0];

          // Remove unsupported certificate option
          v = v.replace(/&sslrootcert=system/gi, "");
          v = v.replace(/\?sslrootcert=system&/gi, "?");
          v = v.replace(/\?sslrootcert=system$/gi, "");

          try {
            const u = new URL(v);

            if (!["postgresql:", "postgres:"].includes(u.protocol)) {
              throw new Error("Wrong protocol");
            }
          } catch {
            console.error("Extracted PostgreSQL URI is still invalid");
            process.exit(1);
          }

          // Mask normalized value in GitHub logs
          console.log(`::add-mask::${v}`);

          // Give the cleaned value to every following workflow step
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DATABASE_URL=${v}\n`
          );

          console.log("DATABASE_URL normalized successfully");
          NODE

      - name: Run database migrations
        run: npm run migrate
