name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Prepare DATABASE_URL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          let raw = (process.env.DATABASE_URL || "").trim();

          if (!raw) {
            console.error("DATABASE_URL secret is missing");
            process.exit(1);
          }

          // Fix copied HTML encoding
          raw = raw.replace(/&amp;/g, "&");

          // Pull PostgreSQL URI out even if GitHub secret has
          // DATABASE_URL=, quotes, psql, or other wrapper text.
          const match = raw.match(/postgres(?:ql)?:\/\/[^\s"'<>]+/i);

          if (!match) {
            console.error("Could not locate PostgreSQL URI in DATABASE_URL");
            process.exit(1);
          }

          let url;

          try {
            url = new URL(match[0]);
          } catch {
            console.error("PostgreSQL URI could not be parsed");
            process.exit(1);
          }

          if (url.protocol !== "postgresql:" && url.protocol !== "postgres:") {
            console.error("DATABASE_URL is not PostgreSQL");
            process.exit(1);
          }

          // PlanetScale gives sslrootcert=system.
          // Node pg was treating "system" as a file path, so remove ONLY this parameter.
          url.searchParams.delete("sslrootcert");

          const clean = url.toString();

          // Never print the credential
          console.log(`::add-mask::${clean}`);

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DATABASE_URL=${clean}\n`
          );

          console.log("DATABASE_URL prepared successfully");
          NODE

      - name: Run database migrations
        run: npm run migrate
