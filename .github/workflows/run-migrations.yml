name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci

      - name: Check DATABASE_URL format safely
        run: |
          node -e '
          const value = process.env.DATABASE_URL || "";
          console.log("DATABASE_URL present:", value.length > 0);
          console.log("Starts with postgresql://:", value.startsWith("postgresql://"));
          if (!value) process.exit(1);
          try {
            const u = new URL(value.trim());
            console.log("URL parse: OK");
            console.log("host present:", Boolean(u.hostname));
            console.log("sslmode:", u.searchParams.get("sslmode"));
            console.log("has sslrootcert:", u.searchParams.has("sslrootcert"));
          } catch {
            console.error("URL parse: INVALID");
            process.exit(1);
          }
          '

      - name: Run database migrations
        run: npm run migrate
