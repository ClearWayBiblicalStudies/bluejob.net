name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Prepare DATABASE_URL
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing"
            exit 1
          fi

          CLEAN_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' | sed -E "s/^DATABASE_URL=//; s/^psql //; s/^['\"]//; s/['\"]$//")"

          case "$CLEAN_URL" in
            postgres://*|postgresql://*)
              ;;
            *)
              echo "DATABASE_URL does not look like a PostgreSQL URI"
              echo "Received prefix: ${CLEAN_URL:0:24}"
              exit 1
              ;;
          esac

          echo "::add-mask::$CLEAN_URL"
          {
            echo "DATABASE_URL=$CLEAN_URL"
          } >> "$GITHUB_ENV"

          echo "DATABASE_URL prepared successfully"

      - name: Run database migrations
        run: npm run migrate
