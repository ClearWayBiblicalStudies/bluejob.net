name: BlueJob Production Database Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-migrations.yml
      - server/migrate.js
      - server/migrations/**
      - server/package.json
      - server/package-lock.json

concurrency:
  group: bluejob-production-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: BlueJob Production Migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - name: "BLUEJOB 1/7 — Checkout triggering revision"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: "BLUEJOB 2/7 — Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: "Install server dependencies"
        run: npm ci

      - name: "BLUEJOB 3/7 — Verify migration engine"
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          console.log("");
          console.log("==========================================");
          console.log(" BLUEJOB MIGRATION ENGINE CHECK");
          console.log("==========================================");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (!pkg.scripts || !pkg.scripts.migrate) {
            throw new Error("server/package.json does not contain a migrate script");
          }

          console.log("npm migrate command:", pkg.scripts.migrate);

          if (!fs.existsSync("migrate.js")) {
            throw new Error("server/migrate.js does not exist");
          }

          const migrationEngine = fs.readFileSync("migrate.js", "utf8");
          if (/CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS\s+schema_migrations/i.test(migrationEngine)) {
            throw new Error("OLD MIGRATION ENGINE DETECTED: schema_migrations is still unqualified");
          }

          if (!migrationEngine.includes("bluejob")) {
            throw new Error("Migration engine does not reference the bluejob schema");
          }

          console.log("Migration engine: CURRENT");
          console.log("Target schema: bluejob (must already exist on PlanetScale branch)");
          console.log("Legacy unqualified schema_migrations path: NOT DETECTED");
          console.log("Migration engine check: PASS");
          NODE

      - name: "BLUEJOB 4/7 — Validate PlanetScale connection"
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          LEGACY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          function stop(message) {
            console.error("");
            console.error("❌ BLUEJOB DATABASE CONFIGURATION FAILED");
            console.error(message);
            process.exit(1);
          }

          const raw = (
            process.env.MIGRATION_DATABASE_URL ||
            process.env.LEGACY_DATABASE_URL ||
            ""
          ).trim();

          if (!raw) {
            stop("Set MIGRATION_DATABASE_URL or DATABASE_URL to a PostgreSQL connection URI.");
          }

          console.log(`::add-mask::${raw}`);

          const line = raw
            .split(/\r?\n/)
            .map((entry) => entry.trim())
            .find((entry) => /^(?:[A-Za-z_][A-Za-z0-9_]*=)?postgres(?:ql)?:\/\//i.test(entry));

          if (!line) {
            stop("Migration database secret must contain a postgres:// or postgresql:// URI.");
          }

          const uri = line.replace(/^[A-Za-z_][A-Za-z0-9_]*=/, "");
          let url;
          try {
            url = new URL(uri);
          } catch {
            stop("Migration database secret cannot be parsed as a PostgreSQL URI.");
          }

          const username = decodeURIComponent(url.username || "");
          const password = decodeURIComponent(url.password || "");
          const host = url.hostname || "";
          const database = (url.pathname || "").replace(/^\//, "");

          if (![
            "postgres:",
            "postgresql:",
          ].includes(url.protocol)) {
            stop("Migration database URI must use postgres:// or postgresql://.");
          }

          if (!username) {
            stop("Database username is missing.");
          }

          if (!password) {
            stop("Database password is missing.");
          }

          if (!host) {
            stop("Database hostname is missing.");
          }

          if (!database) {
            stop("Database name is missing.");
          }

          console.log(`::add-mask::${password}`);

          url.searchParams.delete("sslrootcert");
          url.searchParams.set("sslmode", "require");
          url.searchParams.set("uselibpqcompat", "true");

          const cleanUrl = url.toString();
          console.log(`::add-mask::${cleanUrl}`);

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DATABASE_URL<<BLUEJOB_DATABASE\n${cleanUrl}\nBLUEJOB_DATABASE\n`,
          );

          console.log("");
          console.log("==========================================");
          console.log(" BLUEJOB DATABASE TARGET");
          console.log("==========================================");
          console.log("Provider: PlanetScale PostgreSQL");
          console.log("Host:", host);
          console.log("User:", username);
          console.log("Database:", database);
          console.log("Target schema: bluejob (must already exist on PlanetScale branch)");
          console.log("Credential: MASKED");
          NODE

      - name: "BLUEJOB 5/7 — PlanetScale preflight"
        shell: bash
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const { Client } = require("pg");

          async function main() {
            console.log("");
            console.log("==========================================");
            console.log(" HITTING PLANETSCALE");
            console.log("==========================================");
            console.log("[1] Authenticating...");

            const client = new Client({
              connectionString: process.env.DATABASE_URL,
              connectionTimeoutMillis: 15000,
              statement_timeout: 30000,
              ssl: { rejectUnauthorized: false },
            });

            try {
              await client.connect();
            } catch (error) {
              console.error("");
              console.error("❌ BLUEJOB AUTHENTICATION FAILED");
              if (error.code === "28P01") {
                console.error("PlanetScale rejected the username/password pair.");
              } else {
                console.error(error.message);
              }
              if (error.code) {
                console.error("PostgreSQL code:", error.code);
              }
              process.exit(1);
            }

            try {
              const identity = await client.query(`
                SELECT
                  current_user,
                  current_database()
              `);

              console.log("Authenticated as:", identity.rows[0].current_user);
              console.log("Database:", identity.rows[0].current_database);
              console.log("[2] Checking migration schema...");

              const schemaExists = await client.query(`
                SELECT EXISTS (
                  SELECT 1
                  FROM pg_namespace
                  WHERE nspname = 'bluejob'
                ) AS exists
              `);

              if (!schemaExists.rows[0].exists) {
                throw new Error("bluejob schema is missing");
              }

              console.log("[3] Checking schema permissions...");

              const schemaPrivileges = await client.query(`
                SELECT
                  has_schema_privilege(current_user, 'bluejob', 'USAGE') AS can_use,
                  has_schema_privilege(current_user, 'bluejob', 'CREATE') AS can_create
              `);

              const privileges = schemaPrivileges.rows[0];
              console.log("USAGE permission:", privileges.can_use);
              console.log("CREATE permission:", privileges.can_create);

              if (!privileges.can_use || !privileges.can_create) {
                throw new Error("Database user does not have required access to the migration schema");
              }

              console.log("[4] Testing CREATE TABLE permission...");

              const probeTable = `__bluejob_migration_probe_${process.env.GITHUB_RUN_ID || "manual"}_${process.env.GITHUB_RUN_ATTEMPT || "1"}`
                .replace(/[^A-Za-z0-9_]/g, "_");

              await client.query("BEGIN");
              try {
                await client.query(`CREATE TABLE bluejob.${probeTable} (id BIGINT PRIMARY KEY)`);
                await client.query("ROLLBACK");
              } catch (error) {
                await client.query("ROLLBACK");
                throw error;
              }

              console.log("");
              console.log("✅ PLANETSCALE AUTHENTICATION PASSED");
              console.log("✅ MIGRATION SCHEMA ACCESS PASSED");
              console.log("✅ DATABASE CREATE TEST PASSED");
              console.log("");
              console.log("DATABASE IS CLEARED FOR MIGRATION");
            } catch (error) {
              console.error("");
              console.error("❌ BLUEJOB DATABASE PREFLIGHT FAILED");
              console.error(error.message);
              if (error.code) {
                console.error("PostgreSQL code:", error.code);
              }
              process.exitCode = 1;
              throw error;
            } finally {
              await client.end();
            }
          }

          main().catch((error) => {
            console.error("Unexpected BlueJob preflight failure:", error.message);
            process.exit(1);
          });
          NODE

      - name: "BLUEJOB 6/7 — Run production migrations"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo ""
          echo "=========================================="
          echo " BLUEJOB PRODUCTION MIGRATION"
          echo "=========================================="
          echo ""
          echo "PlanetScale preflight passed."
          echo "Starting production migrations..."
          echo ""
          npm run migrate
          echo ""
          echo "Migration command completed."

      - name: "BLUEJOB 7/7 — Verify production database"
        shell: bash
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          node <<'NODE'
          const { Client } = require("pg");

          async function main() {
            const client = new Client({
              connectionString: process.env.DATABASE_URL,
              connectionTimeoutMillis: 15000,
              ssl: { rejectUnauthorized: false },
            });

            await client.connect();

            try {
              const targetSchema = "bluejob";
              const migrationTable = await client.query(`
                SELECT to_regclass('${targetSchema}.schema_migrations') AS migration_table
              `);

              if (!migrationTable.rows[0].migration_table) {
                throw new Error(`${targetSchema}.schema_migrations does not exist`);
              }

              const migrations = await client.query(`
                SELECT COUNT(*)::integer AS count
                FROM ${targetSchema}.schema_migrations
              `);

              const tables = await client.query(`
                SELECT tablename
                FROM pg_tables
                WHERE schemaname = '${targetSchema}'
                ORDER BY tablename
              `);

              const tableNames = tables.rows.map((row) => row.tablename);
              const requiredTables = ["users", "jobs"];
              const missingTables = requiredTables.filter((table) => !tableNames.includes(table));

              console.log("");
              console.log("==========================================");
              console.log(" BLUEJOB DATABASE VERIFICATION");
              console.log("==========================================");
              console.log("Applied migrations:", migrations.rows[0].count);
              console.log("Migration schema:", targetSchema);
              console.log("Migration schema tables:", tableNames.join(", "));

              if (missingTables.length > 0) {
                throw new Error(
                  "Migration completed but expected tables were not found: " + missingTables.join(", "),
                );
              }

              console.log("");
              console.log("✅ DATABASE CONNECTED");
              console.log("✅ BLUEJOB SCHEMA ACTIVE");
              console.log("✅ MIGRATIONS APPLIED");
              console.log("✅ TABLES VERIFIED");
              console.log("");
              console.log("==========================================");
              console.log(" 🚀 BLUEJOB DATABASE LAUNCH COMPLETE");
              console.log("==========================================");
            } finally {
              await client.end();
            }
          }

          main().catch((error) => {
            console.error("");
            console.error("❌ BLUEJOB POST-MIGRATION VERIFICATION FAILED");
            console.error(error.message);
            process.exit(1);
          });
          NODE
