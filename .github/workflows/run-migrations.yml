name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Prepare DATABASE_URL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          let raw = (process.env.DATABASE_URL || "").trim();

          if (!raw) {
            console.error("DATABASE_URL secret is empty");
            process.exit(1);
          }

          let finalUrl;

          // CASE 1:
          // Secret contains only the PlanetScale password.
          // Build the full Default-role URL automatically.
          if (raw.startsWith("pscale_pw_")) {
            const password = encodeURIComponent(raw);

            finalUrl =
              "postgresql://postgres.la4e9pgvuhqw:" +
              password +
              "@aws-us-east-1-1.pg.psdb.cloud:5432/postgres?sslmode=require";
          }

          // CASE 2:
          // Secret already contains a full PostgreSQL URL.
          else {
            raw = raw.replace(/&amp;/g, "&");
            raw = raw.replace(/^DATABASE_URL\s*=\s*/i, "");
            raw = raw.replace(/^psql\s+/i, "");
            raw = raw.replace(/^['"]|['"]$/g, "");

            const match = raw.match(/postgres(?:ql)?:\/\/[^\s"'<>]+/i);

            if (!match) {
              console.error("DATABASE_URL is neither a PlanetScale password nor PostgreSQL URL");
              process.exit(1);
            }

            const u = new URL(match[0]);

            // Avoid node-postgres treating "system" as a certificate filename.
            u.searchParams.delete("sslrootcert");

            // Keep SSL enabled.
            u.searchParams.set("sslmode", "require");

            finalUrl = u.toString();
          }

          process.stdout.write(`::add-mask::${finalUrl}\n`);

          const githubEnv = process.env.GITHUB_ENV;
          if (!githubEnv) {
            console.error("GITHUB_ENV is not set");
            process.exit(1);
          }

          fs.appendFileSync(
            githubEnv,
            `DATABASE_URL<<EOF\n${finalUrl}\nEOF\n`
          );

          console.log("BlueJob database connection prepared successfully");
          NODE

      - name: Run database migrations
        run: npm run migrate
