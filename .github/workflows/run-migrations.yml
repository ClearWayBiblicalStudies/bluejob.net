name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci

      - name: Normalize DATABASE_URL safely
        run: |
          node <<'NODE'
          const fs = require("fs");

          let v = process.env.DATABASE_URL || "";

          // Clean common copy/paste problems
          v = v.trim();
          v = v.replace(/^DATABASE_URL=/, "");
          v = v.replace(/^["']|["']$/g, "");
          v = v.replace(/[\r\n]/g, "");
          v = v.replace(/&amp;sslrootcert=system/g, "");
          v = v.replace(/&sslrootcert=system/g, "");
          v = v.replace(/\?sslrootcert=system&amp;/g, "?");
          v = v.replace(/\?sslrootcert=system&/g, "?");
          v = v.replace(/\?sslrootcert=system$/g, "");

          if (!v.startsWith("postgresql://") && !v.startsWith("postgres://")) {
            console.error("DATABASE_URL still does not look like a PostgreSQL URL");
            process.exit(1);
          }

          // Mask normalized value in GitHub logs
          console.log(`::add-mask::${v}`);

          try {
            new URL(v);
          } catch {
            console.error("DATABASE_URL still cannot be parsed after normalization");
            process.exit(1);
          }

          // Give the cleaned value to every following workflow step
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DATABASE_URL=${v}\n`
          );

          console.log("DATABASE_URL normalized successfully");
          NODE

      - name: Run database migrations
        run: npm run migrate
