name: Run BlueJob Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci

      - name: Check DATABASE_URL format safely
        run: |
          node <<'NODE'
          const v = process.env.DATABASE_URL || "";

          console.log("DATABASE_URL present:", v.trim().length > 0);
          if (!v.trim()) {
            console.error("DATABASE_URL is missing or empty");
            process.exit(1);
          }

          console.log("starts postgresql://:", v.startsWith("postgresql://"));
          console.log("starts postgres://:", v.startsWith("postgres://"));
          console.log("starts DATABASE_URL=:", v.startsWith("DATABASE_URL="));
          console.log("has spaces:", v.includes(" "));
          console.log("has newline:", v.includes("\n") || v.includes("\r"));
          console.log("has quotes:", v.includes('"') || v.includes("'"));
          console.log("has sslrootcert:", v.includes("sslrootcert"));
          console.log("at-sign count:", (v.match(/@/g) || []).length);

          try {
            new URL(v.trim());
            console.log("URL parse: OK");
          } catch {
            console.error("DATABASE_URL is malformed (URL parse: INVALID)");
            process.exit(1);
          }
          NODE

      - name: Run database migrations
        run: npm run migrate
