name: BlueJob Production Deploy and Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      LEGACY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Deploy backend worker
        working-directory: server
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Deploy frontend worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Validate live production flows
        working-directory: server
        run: |
          node <<'NODE'
          import { Client } from "pg";
          import { createHash, createHmac, randomBytes } from "node:crypto";

          const base = "https://bluejob.net";
          const report = {};
          const cookieJar = new Map();

          function parseCookie(setCookie) {
            if (!setCookie) return;
            const first = setCookie.split(",")[0];
            const value = first.split(";")[0];
            const [name, raw] = value.split("=");
            if (name && raw !== undefined) cookieJar.set(name.trim(), raw.trim());
          }

          function cookieHeader() {
            return Array.from(cookieJar.entries()).map(([k, v]) => `${k}=${v}`).join("; ");
          }

          async function call(path, options = {}, useCookies = false) {
            const headers = { ...(options.headers || {}) };
            if (useCookies) {
              const c = cookieHeader();
              if (c) headers.Cookie = c;
            }
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              let res;
              try {
                res = await fetch(`${base}${path}`, { ...options, headers });
              } catch (error) {
                if (attempt === 10) throw error;
                await new Promise((resolve) => setTimeout(resolve, 3000));
                continue;
              }
              const setCookie = res.headers.get("set-cookie");
              if (setCookie) parseCookie(setCookie);
              const text = await res.text();
              let body = {};
              try { body = text ? JSON.parse(text) : {}; } catch {}
              if (res.status !== 503 || attempt === 10) return { status: res.status, body, text };
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
          }

          function pass(name, ok, detail = {}) {
            report[name] = { pass: ok, ...detail };
          }

          function connectionStringFrom(value) {
            const line = value?.split(/\r?\n/).map((entry) => entry.trim()).find(
              (entry) => /^(?:[A-Za-z_][A-Za-z0-9_]*=)?postgres(?:ql)?:\/\//i.test(entry),
            );
            if (!line) return null;
            const uri = line.replace(/^[A-Za-z_][A-Za-z0-9_]*=/, "");
            const url = new URL(uri);
            url.searchParams.delete("sslrootcert");
            url.searchParams.set("sslmode", "require");
            url.searchParams.set("uselibpqcompat", "true");
            return url.toString();
          }

          const databaseUrl = connectionStringFrom(process.env.MIGRATION_DATABASE_URL || process.env.LEGACY_DATABASE_URL || "");
          const db = databaseUrl ? new Client({ connectionString: databaseUrl, ssl: { rejectUnauthorized: false } }) : null;
          if (db) await db.connect();

          const email = `copilot.live.${Date.now()}@example.com`;
          const password = "BlueJobLiveTest123!";
          const resetPassword = "BlueJobLiveReset123!";

          const signupPage = await call("/signup");
          pass("signup_page_loads", signupPage.status === 200, { status: signupPage.status });

          const forgotPage = await call("/forgot-password");
          pass("forgot_password_page_loads", forgotPage.status === 200 && /reset password|send reset link/i.test(forgotPage.text), { status: forgotPage.status });

          const signup = await call("/api/auth/signup", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name: "Copilot Live Test", email, password }),
          });
          pass("new_account_registers", signup.status === 200 || signup.status === 201, { status: signup.status, body: signup.body });

          const duplicate = await call("/api/auth/signup", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name: "Copilot Live Test", email, password }),
          });
          pass("duplicate_registration_rejected", duplicate.status === 409, { status: duplicate.status, body: duplicate.body });

          cookieJar.clear();
          const login = await call("/api/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email, password }),
          }, true);
          pass("login_works", login.status === 200, { status: login.status, body: login.body });

          cookieJar.clear();
          const invalidPassword = await call("/api/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email, password: `${password}-wrong` }),
          });
          pass("invalid_password_rejected", invalidPassword.status === 401, { status: invalidPassword.status, body: invalidPassword.body });

          cookieJar.clear();
          await call("/api/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email, password }),
          }, true);

          const me = await call("/api/me", {}, true);
          pass("session_survives_refresh", me.status === 200, { status: me.status, body: me.body });

          const logout = await call("/api/auth/logout", { method: "POST" }, true);
          pass("logout_works", logout.status === 200 || logout.status === 204, { status: logout.status });

          const meAfterLogout = await call("/api/me", {}, true);
          pass("logout_terminates_session", meAfterLogout.status === 401, { status: meAfterLogout.status, body: meAfterLogout.body });

          const forgot = await call("/api/auth/forgot-password", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email }),
          });

          let forgotFlowValid = forgot.status === 200;
          let userId = null;
          if (db) {
            const user = await db.query("SELECT id FROM bluejob.users WHERE email=$1", [email]);
            userId = user.rows[0]?.id || null;
            if (userId) {
              const resetRow = await db.query(
                "SELECT token_hash, expires_at, used_at FROM bluejob.password_reset_tokens WHERE user_id=$1 ORDER BY created_at DESC LIMIT 1",
                [userId],
              );
              forgotFlowValid = forgotFlowValid && !!resetRow.rows[0]?.token_hash && !resetRow.rows[0]?.used_at;
            } else {
              forgotFlowValid = false;
            }
          } else {
            forgotFlowValid = false;
          }
          pass("forgot_password_generates_valid_flow", forgotFlowValid, { status: forgot.status });

          const invalidReset = await call("/api/auth/reset-password", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ token: "invalid-reset-token", password: resetPassword }),
          });
          pass("invalid_reset_token_rejected", invalidReset.status === 400, { status: invalidReset.status, body: invalidReset.body });

          let resetPass = false;
          let rejectsOldPassword = false;
          let expiredResetRejected = false;
          if (db && userId) {
            const expiredToken = randomBytes(32).toString("base64url");
            const expiredTokenHash = createHash("sha256").update(expiredToken).digest("hex");
            await db.query("INSERT INTO bluejob.password_reset_tokens(user_id,token_hash,expires_at) VALUES($1,$2,now()-interval '1 minute')", [userId, expiredTokenHash]);
            const expiredReset = await call("/api/auth/reset-password", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ token: expiredToken, password: resetPassword }),
            });
            expiredResetRejected = expiredReset.status === 400;

            const token = randomBytes(32).toString("base64url");
            const tokenHash = createHash("sha256").update(token).digest("hex");
            await db.query("INSERT INTO bluejob.password_reset_tokens(user_id,token_hash,expires_at) VALUES($1,$2,now()+interval '1 hour')", [userId, tokenHash]);
            const reset = await call("/api/auth/reset-password", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ token, password: resetPassword }),
            });
            const postResetMe = await call("/api/me", {}, true);
            resetPass = reset.status === 200 && postResetMe.status === 401;
            const newLogin = await call("/api/auth/login", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ email, password: resetPassword }),
            });
            const oldLogin = await call("/api/auth/login", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            rejectsOldPassword = oldLogin.status === 401 && newLogin.status === 200;
          }
          pass("expired_reset_token_rejected", expiredResetRejected);
          pass("password_reset_allows_new_and_rejects_old", resetPass && rejectsOldPassword);

          cookieJar.clear();
          await call("/api/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email, password: resetPassword }),
          }, true);

          const checkout = await call("/api/billing/checkout", { method: "POST" }, true);
          pass("stripe_checkout_opens", checkout.status === 200 && typeof checkout.body?.url === "string", { status: checkout.status, body: checkout.body });

          const unauthPaid = await call("/api/passport");
          pass("unauthenticated_paid_access_blocked", unauthPaid.status === 401, { status: unauthPaid.status });

          let unpaidBlocked = false;
          if (db && userId) {
            await db.query("UPDATE bluejob.users SET membership_status='NONE', membership_expires_at=NULL WHERE id=$1", [userId]);
            await db.query("DELETE FROM bluejob.memberships WHERE user_id=$1", [userId]);
            cookieJar.clear();
            await call("/api/auth/login", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ email, password: resetPassword }),
            }, true);
            const unpaid = await call("/api/passport", {}, true);
            unpaidBlocked = unpaid.status === 402;
          }
          pass("unpaid_access_blocked", unpaidBlocked);

          const health = await call("/api/healthz");
          const ready = await call("/api/readyz");
          pass("health_endpoint_ok", health.status === 200, { status: health.status });
          pass("ready_endpoint_ok", ready.status === 200, { status: ready.status });

          let webhookLifecycle = false;
          if (db && userId && process.env.STRIPE_WEBHOOK_SECRET) {
            const customer = `cus_test_${Date.now()}`;
            const subscription = `sub_test_${Date.now()}`;
            await db.query(
              "INSERT INTO bluejob.memberships(user_id,stripe_customer_id,stripe_subscription_id,status,updated_at) VALUES($1,$2,$3,'NONE',now()) ON CONFLICT (user_id) DO UPDATE SET stripe_customer_id=EXCLUDED.stripe_customer_id, stripe_subscription_id=EXCLUDED.stripe_subscription_id, status='NONE', updated_at=now()",
              [userId, customer, subscription],
            );

            async function sendEvent(type, status) {
              const event = {
                id: `evt_${randomBytes(8).toString("hex")}`,
                type,
                data: {
                  object: {
                    id: subscription,
                    customer,
                    status,
                    current_period_end: Math.floor(Date.now() / 1000) + 3600,
                    client_reference_id: userId,
                    payment_status: "paid",
                  },
                },
              };
              const payload = JSON.stringify(event);
              const timestamp = Math.floor(Date.now() / 1000);
              const sig = createHmac("sha256", process.env.STRIPE_WEBHOOK_SECRET).update(`${timestamp}.${payload}`).digest("hex");
              return call("/api/billing/webhook", {
                method: "POST",
                headers: { "content-type": "application/json", "stripe-signature": `t=${timestamp},v1=${sig}` },
                body: payload,
              });
            }

            const activeRes = await sendEvent("checkout.session.completed", "active");
            const pastDueRes = await sendEvent("customer.subscription.updated", "past_due");
            const expiredRes = await sendEvent("customer.subscription.updated", "incomplete_expired");
            const canceledRes = await sendEvent("customer.subscription.deleted", "canceled");
            const statusRows = await db.query("SELECT membership_status FROM bluejob.users WHERE id=$1", [userId]);
            webhookLifecycle = [activeRes, pastDueRes, expiredRes, canceledRes].every((r) => r.status === 200) && statusRows.rows[0]?.membership_status === "CANCELED";
          }
          pass("stripe_webhook_lifecycle_records", webhookLifecycle);

          const authAndBillingPaths = [
            ["/api/auth/signup", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: "x", email: "invalid", password: "short" }) }],
            ["/api/auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: "nobody@example.com", password: "bad" }) }],
            ["/api/auth/forgot-password", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: "nobody@example.com" }) }],
            ["/api/billing/checkout", { method: "POST" }],
          ];
          let noUnhandled = true;
          for (const [path, options] of authAndBillingPaths) {
            const result = await call(path, options, path === "/api/billing/checkout");
            if (result.status === 500 || result.status === 503) noUnhandled = false;
          }
          pass("no_auth_or_payment_unhandled_500_503", noUnhandled);

          if (db) {
            await db.query("DELETE FROM bluejob.password_reset_tokens WHERE user_id=(SELECT id FROM bluejob.users WHERE email=$1)", [email]);
            await db.query("DELETE FROM bluejob.sessions WHERE user_id=(SELECT id FROM bluejob.users WHERE email=$1)", [email]);
            await db.query("DELETE FROM bluejob.memberships WHERE user_id=(SELECT id FROM bluejob.users WHERE email=$1)", [email]);
            await db.query("DELETE FROM bluejob.users WHERE email=$1", [email]);
            await db.end();
          }

          console.log(JSON.stringify({ testEmail: email, report }, null, 2));
          const failures = Object.entries(report).filter(([, value]) => !value.pass);
          if (failures.length) {
            console.error("FAILED TESTS:", failures.map(([name]) => name).join(", "));
            process.exit(1);
          }
          NODE
