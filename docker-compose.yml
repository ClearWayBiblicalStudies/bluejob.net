services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bluejob
      POSTGRES_USER: bluejob
      POSTGRES_PASSWORD: bluejob
    ports: ["5432:5432"]
    volumes: ["bluejob-db:/var/lib/postgresql/data", "./server/migrations:/docker-entrypoint-initdb.d:ro"]
volumes:
  bluejob-db:
