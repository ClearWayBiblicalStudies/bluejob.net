<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password | BlueJob</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff,#f3f8ff);color:#10213a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:440px}.logo{display:block;width:250px;max-width:75vw;margin:0 auto 35px}.card{background:#fff;border:1px solid #d8e7f7;border-radius:26px;padding:32px;box-shadow:0 22px 60px rgba(20,85,160,.12)}
h1{margin:0 0 8px;font-size:34px;text-align:center}.sub{text-align:center;color:#6b7a90;margin:0 0 28px}label{display:block;font-weight:700;margin:18px 0 8px}
input{width:100%;padding:16px;border:1px solid #c9d9eb;border-radius:13px;font-size:16px;outline:none;background:#fff;color:#10213a}input:focus{border-color:#1677ff;box-shadow:0 0 0 3px rgba(22,119,255,.12)}
button{width:100%;margin-top:24px;padding:17px;border:0;border-radius:14px;background:linear-gradient(135deg,#48a0ff,#086cf0);color:#fff;font-size:17px;font-weight:800}button:disabled{opacity:.6}
.msg{min-height:24px;margin-top:16px;text-align:center;color:#c62828}.links{text-align:center;margin-top:20px;color:#6b7a90}.links a{color:#1677ff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<img class="logo" src="/bluejob-logo.png" alt="BlueJob">
<div class="card">
<h1>Change your password</h1>
<p class="sub">Your temporary password must be replaced before you continue.</p>
<form id="changePasswordForm">
<label for="password">New password</label>
<input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmPassword">Confirm password</label>
<input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
<button id="changeBtn" type="submit">Update password</button>
<div class="msg" id="msg"></div>
</form>
<div class="links"><a href="/login.html">Back to log in</a></div>
</div>
</div>
<script>
function destination(user){
const role=user?.role||(Array.isArray(user?.roles)?user.roles[0]:null);
if(role==="SUPER_ADMIN"||role==="ADMIN")return"/app/admin";
return role==="CONTRACTOR"?"/app/contractor":"/app/worker";
}
document.getElementById("changePasswordForm").addEventListener("submit",async function(e){
e.preventDefault();
const btn=document.getElementById("changeBtn");
const msg=document.getElementById("msg");
const nextPassword=document.querySelector("#password").value;
const confirm=document.getElementById("confirmPassword").value;
if(nextPassword!==confirm){msg.style.color="#c62828";msg.textContent="Passwords do not match";return;}
btn.disabled=true;
btn.textContent="Updating...";
msg.textContent="";
try{
const response=await fetch("/api/auth/change-password",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({password:nextPassword})});
const data=await response.json();
if(!response.ok)throw new Error(data.error||"Password update failed");
msg.style.color="#16865c";
msg.textContent="Password updated. Redirecting...";
window.location.href=destination(data.user);
}catch(err){
msg.style.color="#c62828";
msg.textContent=err.message;
btn.disabled=false;
btn.textContent="Update password";
}
});
</script>
</body>
</html>
